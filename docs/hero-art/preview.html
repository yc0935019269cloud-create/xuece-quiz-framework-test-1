<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><base href="../../"><title>128 款角色與動畫展示</title><link rel="stylesheet" href="css/font.css"><link rel="stylesheet" href="css/style.css?v=149"><style>
body{background:#111827;color:#ecedf8;margin:0;font-family:system-ui,"Microsoft JhengHei",sans-serif}main{max-width:1200px;margin:auto;padding:28px 20px 80px}h1{font-size:32px;margin:0}.sub{color:#b8c5df;line-height:1.8}.demo{position:sticky;top:0;z-index:20;padding:16px;background:#151d30ee;border:1px solid #424d67;border-radius:16px;margin:20px 0}.stage{height:245px;background:#242c43;max-width:800px;margin:10px auto;border-radius:12px}.stage .ent.hero{left:16%;bottom:25px}.stage .ent.mon{right:18%;bottom:38px}.controls{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.card{display:flex;align-items:center;flex-direction:column;background:#202a40;border:1px solid #4a5875;color:#f5edff;border-radius:13px;padding:10px;cursor:pointer;min-height:190px;box-shadow:none}.card:hover,.card.active{border-color:#d4b5ff;background:#32314e}.card b{margin-top:5px}.card small{color:#adbad3}h2{margin-top:32px}h3{color:#c8b1e5;font-weight:500;font-size:17px}.demo .hero-body{position:relative}.hero-sprite canvas{max-width:none}#status{min-height:24px;text-align:center;color:#dac5f9;font-size:14px} .stage::after{background:none}@media(max-width:600px){main{padding:16px 10px}.cards{grid-template-columns:repeat(2,1fr)}.stage{height:195px}.stage .ent.hero{left:6%}.stage .ent.mon{right:7%}.demo{padding:8px}.card{min-height:165px}.card .hero-sprite{width:125px!important;height:125px!important}}
</style></head><body><main><h1>8 個職業 · 128 款會動的造型。</h1><p class="sub">每職業 8 男、8 女；新增影刃、武僧與吟遊詩人。新職業男女第一款免費，其餘造型用魂晶購買；點選造型後可試看待機、4 種攻擊與爆擊。這裡使用與遊戲相同的姿勢素材、角色播放器與攻擊特效。<br><a href="index.html">進入遊戲 → 職業殿堂 → 造型</a></p><div class="demo"><b id="actorName"></b><div class="stage" id="stage"><div class="ent hero" id="eHero"></div><div class="ent mon" id="eMon"><div class="shadow"></div></div></div><div class="controls"><button class="px-btn" data-move="0">攻擊 1</button><button class="px-btn" data-move="1">攻擊 2</button><button class="px-btn" data-move="2">攻擊 3</button><button class="px-btn" data-move="3">攻擊 4</button><button class="px-btn purple" data-move="random">隨機攻擊</button><button class="px-btn gold" data-move="critical">爆擊</button></div><div id="status">待機：呼吸與眨眼</div></div><div class="controls" id="classPicker" aria-label="選擇職業"></div><div id="gallery"></div></main>
<script>window.C={CLASSES:['knight','mage','ranger','cleric','berserker','assassin','monk','bard'].map(id=>({id})),HERO_SKINS:{knight:[],mage:[],ranger:[],cleric:[],berserker:[]},skinIcon:x=>x.id};window.U={sleep:ms=>new Promise(r=>setTimeout(r,ms)),rnd:(a,b)=>Math.floor(a+Math.random()*(b-a+1)),h:html=>{const t=document.createElement('template');t.innerHTML=html;return t.content.firstElementChild},clamp:(n,a,b)=>Math.max(a,Math.min(b,n)),pick:a=>a[Math.floor(Math.random()*a.length)]};window.SFX={play(){}};window.HAPTIC={buzz(){}};</script>
<script src="js/sprites.js?v=149"></script><script src="js/hero-atlas.js?v=149"></script><script src="js/heroes.js?v=149"></script><script src="js/fx.js?v=149"></script>
<script>
const classNames={knight:'騎士',mage:'法師',ranger:'遊俠',cleric:'聖女',berserker:'狂戰士',assassin:'影刃',monk:'武僧',bard:'吟遊詩人'};let active=HeroAnim.ACTORS.find(a=>a.cls==='assassin')||HeroAnim.ACTORS[0],busy=false;
document.getElementById('classPicker').innerHTML=Object.entries(classNames).map(([id,name])=>'<button class="px-btn small" data-class="'+id+'">'+name+'</button>').join('');
function drawGallery(cls){document.getElementById('gallery').innerHTML='<section><h2>'+classNames[cls]+'</h2>'+['male','female'].map(g=>'<h3>'+(g==='male'?'男生':'女生')+' · '+HeroAnim.ACTORS.filter(a=>a.cls===cls&&a.gender===g).length+' 款</h3><div class="cards">'+HeroAnim.ACTORS.filter(a=>a.cls===cls&&a.gender===g).map(a=>'<button class="card" data-actor="'+a.id+'">'+HeroAnim.html(a.id,160)+'<b>'+a.name+'</b><small>'+a.id.replace('px_','')+'</small></button>').join('')+'</div>').join('')+'</section>';document.querySelectorAll('[data-class]').forEach(b=>b.classList.toggle('gold',b.dataset.class===cls));choose(HeroAnim.ACTORS.find(a=>a.cls===cls).id);}

function choose(id){if(busy)return;active=HeroAnim.get(id);document.getElementById('actorName').textContent=classNames[active.cls]+' · '+active.name;document.getElementById('eHero').innerHTML=FX.heroHD('ha:'+id,active.cls,180);document.getElementById('eMon').innerHTML='<div class="shadow"></div>'+SP.icon('slime',90);document.querySelectorAll('[data-actor]').forEach(b=>b.classList.toggle('active',b.dataset.actor===id));document.getElementById('status').textContent='待機：呼吸與眨眼';}
document.getElementById('gallery').onclick=e=>{const b=e.target.closest('[data-actor]');if(b)choose(b.dataset.actor);};document.getElementById('classPicker').onclick=e=>{const b=e.target.closest('[data-class]');if(b&&!busy)drawGallery(b.dataset.class);};drawGallery(active.cls);
document.querySelectorAll('[data-move]').forEach(b=>b.onclick=async()=>{if(busy)return;busy=true;document.querySelectorAll('[data-move]').forEach(x=>x.disabled=true);try{let name;if(b.dataset.move==='critical'){name='爆擊';await FX.critical(active.cls);}else if(b.dataset.move==='random'){name=await FX.attack(active.cls,{});}else{const index=Number(b.dataset.move);name=Object.keys(FX.ATTACKS[active.cls])[index];await Promise.all([HeroAnim.play(document.getElementById('eHero'),'attack',index),FX.ATTACKS[active.cls][name]()]);}document.getElementById('status').textContent=name+' · 已回到待機';}finally{busy=false;document.querySelectorAll('[data-move]').forEach(x=>x.disabled=false);}});
</script></body></html>
